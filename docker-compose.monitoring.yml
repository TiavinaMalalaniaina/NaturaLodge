# Stack de monitoring — déploiement Coolify où db/server/client sont 3 ressources séparées
# (pas ce docker-compose.yml). Toutes les ressources Coolify d'une même VPS partagent le réseau
# Docker global "coolify" (`docker network ls`) — ce fichier s'y raccroche en externe pour
# scraper les 3 conteneurs par leur nom réel (voir SERVER_CONTAINER/DB_CONTAINER/CLIENT_CONTAINER
# ci-dessous, et monitoring/README.md pour comment les retrouver après un redéploiement).
#
# Lancement (SSH sur la VPS, indépendant de l'UI Coolify) :
#   git pull
#   POSTGRES_EXPORTER_DSN="postgresql://<user>:<password>@fyras9iwq30860e2irn6oogg:5432/<db>?sslmode=disable" \
#   docker compose -f docker-compose.monitoring.yml up -d
# (identifiants réels de la base Coolify — Coolify UI, ressource DB → Configuration)
#
# Accès aux dashboards : Grafana et Uptime Kuma sont volontairement liés à 127.0.0.1 (jamais
# exposés publiquement par défaut, aucune des deux interfaces n'ayant de TLS ni de protection
# anti-bruteforce sérieuse) — voir monitoring/README.md pour les options d'accès (tunnel SSH ou
# domaine Coolify + Traefik).

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - default

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      # Pas de valeur par défaut valide possible : Coolify génère user/password/db aléatoirement
      # à la création de la ressource DB. Récupérer les vrais identifiants dans Coolify → ressource
      # DB → Configuration, host = nom du conteneur DB (`docker ps`, ex. fyras9iwq30860e2irn6oogg).
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?"Définir POSTGRES_EXPORTER_DSN (voir monitoring/README.md)"}
    networks:
      - default

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command:
      # CLIENT_CONTAINER change à chaque redéploiement du frontend tant qu'aucun nom de conteneur
      # stable n'est fixé côté Coolify (UI de la ressource client → Advanced → Container Name) —
      # voir monitoring/README.md. Valeur ci-dessous = celle constatée le 2026-09-13, à vérifier.
      - --nginx.scrape-uri=http://${CLIENT_CONTAINER:-c6uht499syquqb605dbdxocq-193520081631}/nginx_status
    networks:
      - default

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - default

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - default

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      # Change au premier démarrage — voir monitoring/README.md. GF_SECURITY_ADMIN_PASSWORD n'a
      # d'effet qu'à la création du volume ; changer le mot de passe plus tard se fait depuis l'UI.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-on-first-login}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - default

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  uptime_kuma_data:

networks:
  default:
    name: coolify
    external: true
