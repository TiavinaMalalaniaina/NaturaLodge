name: Client checks

on:
  pull_request:
    branches: [develop, preprod, main]
    paths: ['client/**', '.github/workflows/client-checks.yml']
  push:
    branches: [develop]
    paths: ['client/**', '.github/workflows/client-checks.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
