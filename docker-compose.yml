services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naturalodge
      POSTGRES_PASSWORD: naturalodge
      POSTGRES_DB: naturalodge
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalodge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://naturalodge:naturalodge@db:5432/naturalodge?schema=public
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${CLIENT_PORT:-8081}}
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8081}:80"

volumes:
  db_data:
