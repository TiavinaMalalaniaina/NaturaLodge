services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naturalodge
      POSTGRES_PASSWORD: naturalodge
      POSTGRES_DB: naturalodge
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalodge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://naturalodge:naturalodge@db:5432/naturalodge?schema=public
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:4321}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, uniquelocal}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${CLIENT_PORT:-8081}}
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: ${APP_ENV:-development}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8081}:80"

  # Site public. PUBLIC_API_URL est figé dans le JS au build : c'est l'URL vue par le navigateur du
  # visiteur, pas le nom de service Docker. WEBSITE_URL (serveur) doit correspondre à l'origine du site.
  website:
    build:
      context: ./website
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/public}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEBSITE_PORT:-4321}:80"

volumes:
  db_data:

# Nom explicite (plutôt que le nom auto-généré à partir du dossier, ex. "naturalodge_default") —
# docker-compose.monitoring.yml s'y raccroche en réseau externe pour scraper server/db/client par
# leur nom de service, sans dépendre du nom du dossier de déploiement sur la VPS.
networks:
  default:
    name: naturalodge-network
