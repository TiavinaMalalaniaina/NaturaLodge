server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Behind the VPS TLS proxy, absolute redirects (/connexion -> /connexion/) would point to http://host:80.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    # API publique servie depuis l'origine du site : le cookie de session client est un cookie de
    # premier niveau (SameSite=Lax), jamais bloqué comme cookie tiers. ${API_UPSTREAM} = nom du
    # conteneur serveur ("server" avec docker-compose.yml, naturalodge-server-container sur Coolify),
    # substitué au démarrage par l'entrypoint nginx (fichier placé dans /etc/nginx/templates/).
    location /api/public/ {
        proxy_pass http://${API_UPSTREAM}:4000/api/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preuves de paiement : 5 Mo max côté API.
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }

    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
